<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — ShopApp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="container">
        <!-- Вход -->
        <section id="login" class="card login-box" hidden>
            <h2>Вход в админ-панель</h2>
            <form id="login-form">
                <div class="field">
                    <label for="admin-key">Ключ администратора</label>
                    <input id="admin-key" type="password" required autocomplete="current-password">
                </div>
                <div class="field-error" id="login-error"></div>
                <button class="btn btn-block" type="submit">Войти</button>
            </form>
        </section>

        <!-- Панель -->
        <section id="panel" hidden>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
                <h1 style="margin:0">Админ-панель</h1>
                <button class="btn btn-outline btn-sm" id="logout" style="margin-left:auto">Выйти</button>
            </div>

            <div class="tabs">
                <button class="chip active" data-tab="orders">📦 Заказы</button>
                <button class="chip" data-tab="products">🏷️ Товары</button>
            </div>

            <!-- Заказы -->
            <div data-pane="orders">
                <div class="toolbar">
                    <select id="status-filter">
                        <option value="">Все статусы</option>
                        <option value="New">Новые</option>
                        <option value="Processing">В обработке</option>
                        <option value="Shipped">Отправленные</option>
                        <option value="Delivered">Доставленные</option>
                        <option value="Cancelled">Отменённые</option>
                    </select>
                    <button class="btn btn-outline" id="reload-orders">↻ Обновить</button>
                </div>
                <div id="admin-orders"></div>
            </div>

            <!-- Товары -->
            <div data-pane="products" hidden>
                <div class="card" style="padding:20px;margin-bottom:20px">
                    <h2 id="product-form-title">Новый товар</h2>
                    <form id="product-form">
                        <input type="hidden" name="id">
                        <div class="form-grid">
                            <div class="field"><label>Название *</label><input name="name" required minlength="2" maxlength="200"></div>
                            <div class="field"><label>Категория *</label><select name="categoryId" required></select></div>
                            <div class="field"><label>Цена *</label><input name="price" type="number" min="0.01" step="0.01" required></div>
                            <div class="field"><label>Остаток *</label><input name="stock" type="number" min="0" step="1" required></div>
                            <div class="field"><label>Ссылка на картинку</label><input name="imageUrl" type="url" placeholder="https://…"></div>
                            <div class="field" style="display:flex;align-items:end;gap:8px">
                                <label style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
                                    <input type="checkbox" name="isActive" checked style="width:auto"> Показывать в каталоге
                                </label>
                            </div>
                        </div>
                        <div class="field"><label>Описание</label><textarea name="description" maxlength="2000"></textarea></div>
                        <div class="field-error" id="product-error"></div>
                        <div style="display:flex;gap:8px">
                            <button class="btn" type="submit" id="product-submit">Добавить товар</button>
                            <button class="btn btn-outline" type="button" id="product-cancel" hidden>Отмена</button>
                        </div>
                    </form>
                </div>

                <div class="card table-wrap">
                    <table class="data">
                        <thead>
                            <tr><th>ID</th><th>Товар</th><th>Категория</th><th>Цена</th><th>Остаток</th><th>Статус</th><th></th></tr>
                        </thead>
                        <tbody id="admin-products"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/js/admin.js"></script>
</body>
</html>
